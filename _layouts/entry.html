layout: default
entry_page: true
body_class: entry-layout
---

<article class="entry-page">

    {{ content }}
  </div>

  {% if page.source %}
  <div class="entry-source">
    <a href="{{ page.source }}" target="_blank" rel="noopener">来源 ↗</a>
  </div>
  {% endif %}
</article>
